# CPTAC QC policy: identical to qc_policy.yaml except that the GrandQC pen rule is off (no pen_slides).
# Run qc.py with --policy configs/qc_policy_cptac.yaml, and pass both policies to export.py.
# Tile QC decisions for data_prep/qc.py. tile.py stores every tile's scores; this file decides which
# tiles are used, so changing a value here never requires re-tiling. Bump `version` when you change
# a value: decisions go to patches/<tiling version>/qc/<version>/.
# By default one policy serves every fold and both cohorts (TCGA and CPTAC). Set `frozen: true` (with reviewer,
# notes, calibration_patients and blur_reject_below) only once the team has agreed the values, and before
# any training; export.py builds a modeling list only from a frozen policy.
# Edge tiles (touching the tissue mask, not more than half tissue) pass only when no rule below rejects
# or reviews them and they meet all three edge_accept_* cutoffs; the rest go to review.
version: qc-v4-cptac
sources: [CPTAC]           # this policy decides CPTAC only; qc_policy.yaml decides TCGA, and
                           # export.py gets both policies (one per cohort)
frozen: false
reviewer: ""               # who approved the frozen policy
notes: ""                  # how the cutoffs were chosen (e.g. which pilot slides were reviewed)
calibration_patients:     # patients whose tiles or thumbnails were viewed to set the rules (any fold);
                          # a record only: export.py keeps them and marks them qc_calibration
  # pen rule off: GrandQC pen candidates (pen fraction > 0.01) viewed as thumbnails, half B
  - C3L-01155
  - C3L-02504
  - C3L-03728
  - C3N-01334
  # half A
  - C3L-00677
  - C3L-01327
  - C3L-02705
  - C3L-03387
  - C3L-03407
  - C3N-02181
  - C3N-02770
  - C3N-02783
require_signoff: false     # true: export.py blocks every slide without a sign-off (approve or exclude)
# Reject:
max_glass_fraction: 0.9    # more than this fraction of the tile is uncolored glass
blank_fraction: 0.99       # at least this fraction is near-white, or near-black
blur_reject_below: 100     # Laplacian variance below this: reject for focus
# Review (null = off):
blur_review_below: null    # Laplacian variance below this (and not rejected): check focus
dark_mean_rgb: 50          # mean R, G and B all below this
glass_review_above: null   # glass fraction above this (but not above max_glass_fraction)
pale_review_below: null    # mean saturation below this ...
pale_value_above: 180      # ... and mean brightness above this (a pale, washed-out tile)
dark_fraction_review_above: null   # fraction of dark pixels above this (folds, debris, ink)
green_fraction_review_above: 0.02  # fraction of green pixels above this (marker ink)
# Edge tiles accepted without review (all three set, or all null to review every edge tile):
edge_accept_glass_below: 0.5    # glass fraction below this
edge_accept_blur_above: 100     # Laplacian variance at or above this
edge_accept_dark_below: 0.2     # dark-pixel fraction below this
# Slide flags (slides_<subset>.csv) for a sign-off decision; null = no pale flag:
pale_slide_saturation_below: 25 # median tissue-tile mean saturation below this
# GrandQC (per-tile artifact fractions from grandqc.py). true: a slide without current GrandQC data gets
# no decisions, so export.py blocks its patient. false: the settings below are ignored.
grandqc: true
grandqc_min_assessed: 0.5       # tiles with less of their area assessed by GrandQC skip its rules
oof_review_above: 0.5           # review: out-of-focus fraction above this
pen_slides: []                  # pen rule OFF for CPTAC: on the 16 CPTAC slides above 1% GrandQC pen,
pen_tile_review_above: null     # its pen labels sat on stained tissue with no visible ink (label-free review)
fold_review_above: null         # review: fold fraction above this (off until spot-checked)
darkspot_review_above: null     # review: dark-spot fraction above this, not on pale slides (off until spot-checked)
edge_accept_artifact_below: 0.25  # edge auto-accept also needs fold, dark spot and out of focus each at or below this
