# Tile QC decisions for data_prep/qc.py. tile.py stores every tissue tile's scores; this file decides
# which tiles are used, so changing a value here never requires re-tiling. Bump `version` when you
# change a value: decisions go to patches/<tiling version>/qc/<version>/.
# Set `frozen: true` (with reviewer and notes) only once the team has agreed the values; export.py
# builds a modeling list only from a frozen policy. Values below are pilot values for team review.
# A blur score of exactly 0 (a flat tile) is always sent to review, whatever these say.
version: qc-v1
frozen: false
reviewer: ""               # who approved the frozen policy
notes: ""                  # how the cutoffs were chosen (e.g. which pilot slides were reviewed)
# Reject:
max_glass_fraction: 0.9    # more than this fraction of the tile is uncolored glass
blank_fraction: 0.99       # at least this fraction is near-white, or near-black
# Review (null = off):
dark_mean_rgb: 50          # mean R, G and B all below this
min_blur: null             # Laplacian variance below this; tiling-v6 used 20 (team decision)
glass_review_above: null   # glass fraction above this (but not above max_glass_fraction)
pale_review_below: null    # mean saturation below this ...
pale_value_above: 180      # ... and mean brightness above this (a pale, washed-out tile)
dark_fraction_review_above: null   # fraction of dark pixels above this (folds, debris, ink)
green_fraction_review_above: null  # fraction of green pixels above this (marker ink)
